<section class="login-layout">
  <article class="login-copy">
    <p class="kicker">Welcome back</p>
    <h2>Sign in and move straight to active projects.</h2>
    <p>
      Your workspace is now styled as a real product: cleaner hierarchy, better
      spacing, and a clearer entry point for users.
    </p>
  </article>

  <article class="login-panel">
    <h3>Login</h3>

    <label>
      <span>Email</span>
      <input [(ngModel)]="email" placeholder="you@example.com">
    </label>

    <label>
      <span>Password</span>
      <input [(ngModel)]="password" type="password" placeholder="Enter password">
    </label>

    <button (click)="login()">Open workspace</button>

    @if (error) {
      <p class="error">{{ error }}</p>
    }
  </article>
</section>
