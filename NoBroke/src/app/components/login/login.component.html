<section class="login-layout">
  <article class="login-panel">
    <h3>Login</h3>
    <p class="panel-copy">Choose a role and sign in.</p>

    <div class="role-switcher">
      <button
        type="button"
        class="role-btn"
        [class.active]="selectedRole === 'student'"
        (click)="selectedRole = 'student'"
      >
        Student
      </button>
      <button
        type="button"
        class="role-btn"
        [class.active]="selectedRole === 'employer'"
        (click)="selectedRole = 'employer'"
      >
        Employer
      </button>
    </div>

    <label>
      <span>Email</span>
      <input [(ngModel)]="email" placeholder="you@example.com">
    </label>

    <label>
      <span>Password</span>
      <input [(ngModel)]="password" type="password" placeholder="Enter password">
    </label>

    <p class="role-hint">
      Current role: <strong>{{ selectedRole }}</strong>
    </p>

    <button (click)="login()">Sign in</button>

    @if (error) {
      <p class="error">{{ error }}</p>
    }
  </article>
</section>
