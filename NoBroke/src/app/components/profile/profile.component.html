<section class="profile-layout">
  <article class="profile-editor">
    <p class="section-label">Profile settings</p>
    <h2>Shape the way clients see you.</h2>

    <label>
      <span>Skills</span>
      <input [(ngModel)]="skills" placeholder="Angular, UI systems, API integration">
    </label>

    <label>
      <span>GitHub</span>
      <input [(ngModel)]="github" placeholder="https://github.com/username">
    </label>
  </article>

  <article class="profile-preview">
    <p class="section-label">Preview</p>
    <h2>Your public card</h2>

    <div class="preview-item">
      <span>Skills</span>
      <p>{{ skills || 'Add your strengths to make the profile useful.' }}</p>
    </div>

    <div class="preview-item">
      <span>GitHub</span>
      <p>{{ github || 'Link a repository profile to build trust.' }}</p>
    </div>
  </article>
</section>
