<section class="profile-layout">
  <article class="profile-editor">
    <p class="section-label">Profile settings</p>
    <h2>Shape the way teams see you.</h2>

    @if (role === 'guest') {
      <p class="notice">Login as a student to edit your profile.</p>
    } @else if (role === 'employer') {
      <p class="notice">Employers can view this page, but editing is reserved for students.</p>
    }

    <label>
      <span>Skills</span>
      <input [(ngModel)]="skills" placeholder="Angular, UI systems, API integration">
    </label>

    <label>
      <span>GitHub</span>
      <input [(ngModel)]="github" placeholder="https://github.com/username">
    </label>

    <button (click)="saveProfile()">Save profile</button>

    @if (error) {
      <p class="feedback error">{{ error }}</p>
    }

    @if (message) {
      <p class="feedback success">{{ message }}</p>
    }
  </article>
</section>
